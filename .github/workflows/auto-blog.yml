name: Publicar Artigo Semanal no Blog
on:
  schedule:
    # Roda toda terça e quinta às 09:00 (horário de Brasília = 12:00 UTC)
    - cron: '0 12 * * 2,4'
  workflow_dispatch: # Permite rodar manualmente com 1 clique

permissions:
  contents: write

jobs:
  build-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Gerar artigo via Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/gerar-blog.js
      - name: Commit e Push para GitHub Pages
        run: |
          git config user.name "Izzy Bot"
          git config user.email "bot@izhairconcept.com.br"
          git add .
          git commit -m "Novo artigo publicado no blog" || exit 0
          git push
