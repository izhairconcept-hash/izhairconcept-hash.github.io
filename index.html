<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script src="https://unpkg.com/lucide@latest"></script> 
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-V6E4X0X0X0"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-V6E4X0X0X0');
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IZ Hair Concept | Mechas e Tricologia em Funcionários BH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --gold: #C9A96E; --cream: #FAF7F2; --charcoal: #1A1714; --muted: #8A7D72; --ff-display: 'Cormorant Garamond', serif; --ff-body: 'Jost', sans-serif; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--ff-body); background: var(--cream); color: var(--charcoal); line-height: 1.6; }
    .container { max-width: 1160px; margin: 0 auto; padding: 0 24px; }
    header { position: fixed; top: 0; width: 100%; z-index: 100; padding: 20px 0; background: rgba(250,247,242,0.9); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(201,169,110,0.1); }
    nav { display: flex; justify-content: space-between; align-items: center; }
    .logo-iz { font-family: var(--ff-display); font-size: 2.2rem; color: var(--gold); letter-spacing: 0.1em; text-decoration: none; }
    .nav-links a { text-decoration: none; color: var(--charcoal); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.15em; margin-left: 30px; }
    #hero { height: 100vh; display: flex; align-items: center; background: var(--charcoal); color: white; position: relative; overflow: hidden; }
    /* Ajuste do fundo do Hero com o nome exato do arquivo no seu GitHub */
    #hero::before { content: ''; position: absolute; inset: 0; background: url('IMG_2642.JPG') center/cover no-repeat; opacity: 0.4; }
    .hero-content { z-index: 2; position: relative; max-width: 700px; }
    h1 { font-family: var(--ff-display); font-size: clamp(3.5rem, 8vw, 5.5rem); line-height: 1; margin-bottom: 25px; }
    .btn-primary { display: inline-block; background: var(--gold); color: white; padding: 20px 45px; text-decoration: none; letter-spacing: 0.2em; font-size: 0.8rem; font-weight: 500; }
    section { padding: 100px 0; }
    .sobre-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; }
    .sobre-img { height: 500px; border: 1px solid var(--gold); padding: 10px; background: white; }
    .sobre-img img { width: 100%; height: 100%; object-fit: cover; }
    .galeria-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
    .galeria-item { height: 400px; overflow: hidden; position: relative; background: #eee; }
    .galeria-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
    .galeria-item:hover img { transform: scale(1.05); }
    .reveal { opacity: 0; transform: translateY(30px); transition: 1s all ease; }
    .reveal.visible { opacity: 1; transform: translateY(0); }
    @media (max-width: 768px) { .sobre-grid { grid-template-columns: 1fr; } .nav-links { display: none; } }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <nav>
        <a href="/" class="logo-iz">IZ HAIR</a>
        <div class="nav-links">
          <a href="#servicos">Serviços</a>
          <a href="#sobre">Sobre</a>
          <a href="#galeria">Portfolio</a>
          <a href="https://wa.me/5531992555714" style="color: var(--gold); font-weight: bold;">Agendar</a>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <section id="hero">
      <div class="container">
        <div class="hero-content reveal">
          <span style="color: var(--gold); text-transform: uppercase; letter-spacing: 0.3em; font-size: 0.8rem;">Belo Horizonte</span>
          <h1>A arte da cor e o cuidado da ciência.</h1>
          <a href="https://wa.me/5531992555714" class="btn-primary">AGENDAR AGORA</a>
        </div>
      </div>
    </section>

    <section id="sobre" style="background: white;">
      <div class="container">
        <div class="sobre-grid">
          <div class="sobre-img reveal">
            <img src="IMG_7332.JPG" alt="Izabella Miranda">
          </div>
          <div class="sobre-content reveal">
            <h2 style="font-family: var(--ff-display); font-size: 3rem; margin-bottom: 20px;">Izabella Miranda</h2>
            <p style="color: var(--muted); font-size: 1.1rem;">Especialista em mechas e tricologia no bairro Funcionários. Unindo estética de luxo e saúde capilar em cada atendimento.</p>
          </div>
        </div>
      </div>
    </section>

    <section id="galeria">
      <div class="container">
        <h2 style="font-family: var(--ff-display); font-size: 3rem; margin-bottom: 50px; text-align: center;">Nosso Portfolio</h2>
        <div class="galeria-grid">
          <div class="galeria-item reveal"><img src="IMG_2642.JPG" alt="Loiro"></div>
          <div class="galeria-item reveal"><img src="IMG_2852.JPG" alt="Iluminada"></div>
          <div class="galeria-item reveal"><img src="IMG_5265.JPG" alt="Mechas"></div>
          <div class="galeria-item reveal"><img src="IMG_5656.JPG" alt="Cor"></div>
          <div class="galeria-item reveal"><img src="IMG_3938.JPG" alt="Make"></div>
          <div class="galeria-item reveal"><img src="IMG_4182.jpg" alt="Unhas"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    lucide.createIcons();
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
    }, { threshold: 0.1 });
    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
  </script>
</body>
</html>
